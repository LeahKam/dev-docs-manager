readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gradio>=6.17.3",
    "llama-index>=0.14.22",
    "llama-index-embeddings-cohere>=0.5.0",
    "llama-index-vector-stores-pinecone>=0.4.0",
    "llama-index-llms-openai>=0.3.0",
    "netfree-unstrict-ssl>=0.1.3",
    "pinecone>=6.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.25.0",
]

